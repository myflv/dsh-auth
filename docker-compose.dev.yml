# 本地开发用（覆盖主 compose）：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# 构建本地镜像 dsh-auth:dev 运行，不拉 GHCR、不覆盖线上 latest
services:
  dsh-auth:
    image: dsh-auth:dev
    pull_policy: never
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
