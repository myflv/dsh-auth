name: build-push

on:
  push:
    branches: [main]
    paths-ignore:
      - '.dsh-version'   # 版本记录提交不触发重建
  schedule:
    - cron: '17 3 * * *'   # 每天检查 dsh 是否有新版本
  workflow_dispatch:

permissions:
  contents: write   # 更新 .dsh-version
  packages: write   # 推送 GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 dsh 最新版本
        id: check
        run: |
          NEW=$(curl -s https://registry.npmjs.org/@deepseek-ai/dsh/latest | jq -r .version)
          OLD=$(cat .dsh-version 2>/dev/null || echo none)
          echo "npm 最新: $NEW / 镜像内: $OLD"
          echo "dsh_version=$NEW" >> "$GITHUB_OUTPUT"
          # 定时触发且版本没变 -> 跳过；代码变更或手动触发 -> 总是构建
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$NEW" = "$OLD" ]; then
            echo "无新版本，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 登录 GHCR
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.check.outputs.dsh_version }}
          build-args: |
            DSH_VERSION=${{ steps.check.outputs.dsh_version }}

      - name: 记录已构建的 dsh 版本
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "${{ steps.check.outputs.dsh_version }}" > .dsh-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .dsh-version
          git commit -m "chore: dsh ${{ steps.check.outputs.dsh_version }}" && git push || echo "无需提交"
