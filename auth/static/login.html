<title>登录 · dsh</title>
<style>
/* 登录表单：对齐 DeepSeek 开放平台登录页右侧样式，居中展示 */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: rgb(255, 255, 255);
  --text-1: rgb(15, 17, 21);                   /* neutral-bluish-1000 */
  --text-2: rgb(97, 102, 107);                 /* neutral-bluish-700 */
  --text-3: rgb(173, 178, 184);                /* neutral-bluish-400 */
  --input-border: rgba(15, 17, 21, 0.12);      /* border-l3 */
  --input-hover-border: rgba(15, 17, 21, 0.2);
  --brand: rgb(65, 118, 230);                  /* deepseek-500 */
  --btn: rgb(15, 17, 21);                      /* 深色主按钮 */
  --btn-hover: rgb(67, 69, 74);
  --error: rgb(236, 19, 19);
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: rgb(21, 21, 23);                     /* neutral-bluish-950 */
    --text-1: rgb(235, 238, 242);
    --text-2: rgb(151, 157, 166);
    --text-3: rgb(101, 103, 107);
    --input-border: rgba(255, 255, 255, 0.14);
    --input-hover-border: rgba(255, 255, 255, 0.25);
    --btn: rgb(249, 250, 251);
    --btn-hover: rgb(225, 229, 238);
  }
}
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
    'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  color: var(--text-1);
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.form-box { width: 360px; max-width: calc(100vw - 48px); }

/* 官方 wordmark：DeepSeek 字母 + API 黑标 */
.wordmark {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  margin-bottom: 44px;
  color: var(--text-1);
}
.wordmark svg:first-child { width: 122px; height: auto; }
.wordmark svg:last-child { width: 43px; height: auto; }
.wordmark svg path { fill: currentColor; }
.wordmark svg rect { fill: currentColor; }

input {
  width: 100%; height: 44px; padding: 0 16px;
  font-size: 14px; font-family: inherit; color: var(--text-1);
  background: var(--bg);
  border: 1px solid var(--input-border);
  border-radius: 12px; outline: none;
  transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
}
input::placeholder { color: var(--text-3); }
input:hover { border-color: var(--input-hover-border); }
input:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(65, 118, 230, 0.12);
}
input + input { margin-top: 14px; }

.error { font-size: 13px; color: var(--error); margin: 14px 0 0; }
.error:empty { display: none; }

button {
  width: 100%; height: 44px; margin-top: 22px;
  border: none;
  border-radius: 100px;           /* 胶囊按钮（对齐开放平台） */
  background: var(--btn); color: var(--bg);
  font-size: 15px; font-weight: 500; font-family: inherit;
  cursor: pointer;
  transition: background 0.2s var(--ease);
}
button:hover { background: var(--btn-hover); }
button:active { opacity: 0.85; }
</style>
</head>
